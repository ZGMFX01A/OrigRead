name: "Build Commit"
on:
    push:
        branches:
            - main
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            - name: Run unit tests
              if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
              run: >-
                  ./gradlew
                  testStandardGithubReleaseUnitTest
                  testLlmGithubReleaseUnitTest
                  --max-workers=2

            - name: Build APKs
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
              run: >-
                  ./gradlew
                  assembleStandardGithubRelease
                  assembleLlmGithubRelease

            - name: Upload workflow artifact
              if: startsWith(github.ref, 'refs/tags/v')
              uses: actions/upload-artifact@v4
              with:
                  name: OrigRead-${{ github.ref_name }}-${{ github.sha }}
                  path: |
                      app/build/outputs/apk/standardGithub/release/*.apk
                      app/build/outputs/apk/llmGithub/release/*.apk

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  name: OrigRead ${{ github.ref_name }}
                  generate_release_notes: true
                  files: |
                      app/build/outputs/apk/standardGithub/release/*.apk
                      app/build/outputs/apk/llmGithub/release/*.apk

