name: "Build Pull Request"
on: pull_request

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            - name: Build Standard and LLM APKs
              run: >-
                  ./gradlew
                  assembleStandardGithubRelease
                  assembleLlmGithubRelease

            - uses: actions/upload-artifact@v4
              with:
                  name: github-${{ github.sha }}
                  path: |
                      app/build/outputs/apk/standardGithub/release/*.apk
                      app/build/outputs/apk/llmGithub/release/*.apk

